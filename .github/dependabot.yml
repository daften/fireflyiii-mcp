version: 2
updates:
  # --- Security updates (npm) ---------------------------------------------
  # Security PRs are always raised against the default branch (main).
  # `open-pull-requests-limit: 0` disables *version* updates for this entry
  # so it exists purely to configure security updates — grouped, so that
  # concurrent advisories arrive as ONE PR (separate PRs would each fail the
  # relative audit's predecessor and can still race each other on the
  # lockfile).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    # Explicit prefix: the PR title becomes the automated release's changelog
    # bullet (auto-release.yml), so it must read like a conventional commit —
    # never rely on Dependabot's convention auto-detection for that.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]

  # --- Routine version updates (npm) → develop ----------------------------
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Listed first so it wins the match: `vitest` and `@vitest/*` are
      # version-locked on each other (`@vitest/coverage-v8@X` peers
      # `vitest: "X"` exactly), so a bump that splits them across two PRs
      # can never install — each half fails `npm ci` with ERESOLVE until the
      # other lands. No `update-types` filter, so majors group too; that is
      # precisely the case `minor-and-patch` cannot cover.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # --- GitHub Actions version updates → develop ---------------------------
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-actions:
        patterns: ["*"]
