name: Publish

on:
  push:
    tags:
      - 'v*'           # tagged release -> "release" channel
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly -> "nightly" channel
  workflow_dispatch:
    inputs:
      force:
        description: 'Nightly: publish even if develop has not changed since the last nightly'
        type: boolean
        default: false

permissions: {}

jobs:
  # Resolve which channel this run is (release vs nightly) and all the
  # channel-specific values the downstream jobs need. A tag push is a release;
  # schedule / manual dispatch is a nightly (guarded so it only builds when develop
  # changed since the rolling `nightly` tag).
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The exact commit every later job checks out. Each job used to check out `develop` on its own,
      # so a push landing mid-run could publish a commit that `verify` never tested.
      sha: ${{ steps.resolve.outputs.sha }}
      channel: ${{ steps.resolve.outputs.channel }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      version: ${{ steps.resolve.outputs.version }}
      npm_tag: ${{ steps.resolve.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'develop' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve channel and version
        id: resolve
        env:
          # env indirection, not inline ${{ }} interpolation, for anything spliced into shell.
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then
            # Tag push -> release. Version comes from the tag; npm 'latest' dist-tag.
            VERSION="${GITHUB_REF_NAME#v}"
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Release channel: v$VERSION"
          else
            # schedule / workflow_dispatch -> nightly. Prerelease version, 'nightly' dist-tag.
            NEXT=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); [a,b,c+1].join('.')")
            STAMP=$(date -u +%Y%m%dT%H%M)
            VERSION="${NEXT}-nightly.${STAMP}"
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "npm_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "Nightly channel: $VERSION"
            # Change-guard: publish only if HEAD differs from the rolling nightly tag.
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$FORCE" = "true" ]; then
              echo "force=true requested; publishing."
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              if git rev-parse -q --verify refs/tags/nightly >/dev/null; then
                LAST_SHA=$(git rev-list -n 1 nightly)
              else
                LAST_SHA=""
              fi
              echo "HEAD=$HEAD_SHA  last_nightly=${LAST_SHA:-<none>}"
              if [ -n "$LAST_SHA" ] && [ "$HEAD_SHA" = "$LAST_SHA" ]; then
                echo "develop unchanged since last nightly; skipping publish."
                echo "should_publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "develop changed (or no prior nightly); will publish."
                echo "should_publish=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  verify:
    needs: setup
    if: needs.setup.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}
          # Tags needed by the changelog guard below, which compares each released section
          # against the tag that published it.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Last gate before anything reaches npm or GHCR: the release notes are extracted from
      # CHANGELOG.md, so a section silently rewritten by the merge=union driver would ship as the
      # GitHub Release body and render on the docs site.
      - name: Guard CHANGELOG.md against silent union-merge corruption
        run: node scripts/changelog-guard.mjs

      - name: Validate the tag matches package.json
        if: needs.setup.outputs.channel == 'release'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # npm publishes package.json's version while Docker and the release notes use the tag's, so a
          # mismatch would ship different versions under one tag (npm's step would even skip silently
          # if package.json's version was already published).
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error file=package.json::Tag v${VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      - name: Validate CHANGELOG entry exists for this tag
        if: needs.setup.outputs.channel == 'release'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if ! grep -E "^## \[${VERSION}\]" CHANGELOG.md > /dev/null; then
            echo "::error file=CHANGELOG.md::No '## [${VERSION}]' section found in CHANGELOG.md. Add a release entry before tagging."
            exit 1
          fi
          echo "Found CHANGELOG entry for v${VERSION}"
          # Verify the section has actual content (not just empty sub-headers)
          SECTION=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found && /[^[:space:]]/" CHANGELOG.md | grep -v "^### ")
          if [ -z "$SECTION" ]; then
            echo "::error file=CHANGELOG.md::Section ## [${VERSION}] exists but has no entries. Fill in the changelog before tagging."
            exit 1
          fi
          echo "Changelog section has content."

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

  publish-npm:
    needs: [setup, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Set nightly version (in-CI only, not committed)
        if: needs.setup.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm (skip if this version already exists)
        env:
          NPM_TAG: ${{ needs.setup.outputs.npm_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@daften/fireflyiii-mcp@${VERSION}" version > /dev/null 2>&1; then
            echo "v${VERSION} is already published to npm; skipping publish (idempotent re-run)."
          else
            npm publish --provenance --tag "$NPM_TAG"
          fi

  publish-docker:
    needs: [setup, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release pushes semver + latest; nightly pushes only nightly tags. The
      # `enable` flag selects per channel so neither leaks into the other.
      - name: Docker tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/daften/fireflyiii-mcp
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.setup.outputs.channel == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.setup.outputs.channel == 'release' }}
            type=semver,pattern={{major}},enable=${{ needs.setup.outputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ needs.setup.outputs.channel == 'release' }}
            type=raw,value=nightly,enable=${{ needs.setup.outputs.channel == 'nightly' }}
            type=raw,value=nightly-{{date 'YYYYMMDD'}},enable=${{ needs.setup.outputs.channel == 'nightly' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [setup, verify, publish-npm, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - name: Resolve built commit
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # softprops/action-gh-release does NOT read the git tag annotation into the
      # release body, so extract the matching CHANGELOG.md section and pass it as
      # body_path. CHANGELOG.md is the single source of truth for release notes.
      - name: Extract changelog section for release notes
        if: needs.setup.outputs.channel == 'release'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md | awk 'NF { p = 1 } p' | tac | awk 'NF { p = 1 } p' | tac > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::Could not extract release notes for v${VERSION}."
            exit 1
          fi
          echo "Extracted release notes for v${VERSION}:"
          cat release-notes.md

      - name: Create GitHub Release from changelog
        if: needs.setup.outputs.channel == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: false

      - name: Move rolling nightly tag to HEAD
        if: needs.setup.outputs.channel == 'nightly'
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly

      - name: Create/update nightly pre-release
        if: needs.setup.outputs.channel == 'nightly'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          target_commitish: ${{ steps.built.outputs.sha }}
          name: "Nightly ${{ needs.setup.outputs.version }}"
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build of `develop`. **Unstable — for testing unreleased changes.**

            - Version: `${{ needs.setup.outputs.version }}`
            - Commit: ${{ steps.built.outputs.sha }}
            - npm: `npm install @daften/fireflyiii-mcp@nightly`
            - Docker: `docker pull ghcr.io/daften/fireflyiii-mcp:nightly`

            > Default installs (`@latest` / `:latest`) are unaffected and continue to point at the most recent tagged release.
