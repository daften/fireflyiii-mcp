name: Auto-merge security PRs

# Enables GitHub auto-merge on Dependabot security PRs against main. The
# merge itself only happens once branch protection's required checks pass —
# this workflow gates nothing on its own. RELEASE_TOKEN (a PAT) is used so
# the resulting merge push triggers auto-release.yml; auto-merge enabled by
# the default GITHUB_TOKEN would produce an inert push and break the chain.
#
# RELEASE_TOKEN must be provisioned as a *Dependabot* secret in addition to
# the Actions secret: pull_request runs triggered by dependabot[bot] receive
# only the Dependabot secret store (repository Actions secrets resolve
# empty there, by GitHub design). It also needs "Dependabot alerts: Read
# only" — see the advisory lookup below.

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Keep the action's author and signed-commit verification. Its advisory
      # matcher assumes an "= " prefix that GitHub no longer always returns.
      # Retain RELEASE_TOKEN here (54a05ba); the separate alert query also
      # requires this token, with Dependabot alerts read permission.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}

      # Execute only the trusted base revision, never code from the PR head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Match security advisories
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEPENDENCIES_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          DEPENDENCY_GROUP: ${{ steps.meta.outputs.dependency-group }}
        run: node scripts/security-pr-alerts.mjs

      # Only enable auto-merge after matching a security advisory.
      # Merge commit, never squash: this repo keeps merge commits everywhere
      # so branch histories stay shared (see AGENTS.md, "Branching Model").
      - name: Enable auto-merge (merge commit)
        if: steps.alerts.outputs.security == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
