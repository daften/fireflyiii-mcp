name: Auto-release security fixes

# Fully automated patch releases for Dependabot security merges on main.
# Chain: dependabot security PR -> auto-merge.yml enables auto-merge ->
# merge commit lands here -> patch bump + changelog + tag -> the tag push
# (made with RELEASE_TOKEN, so it is NOT inert like GITHUB_TOKEN pushes)
# triggers publish.yml's normal release path.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Compute version + changelog, print the diff, but do not commit/tag/push'
        type: boolean
        default: true

permissions: {}

# Serialize: two closely-spaced merges to main must not race the version
# bump/tag; the second run waits and releases on top of the first.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    # Dependabot security merges only. Merges are merge commits, so the
    # subject reads "Merge pull request #N from daften/dependabot/<branch>";
    # creating a branch under that name requires push access to this repo (a
    # fork PR would read "from <fork-owner>/..."), which is a stronger gate
    # than commit authorship — a commit's author field is just a git config
    # value. On main a Dependabot PR is a security fix by construction:
    # version updates target develop. Promotion merges from develop and our
    # own chore(release): commits do not match.
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'from daften/dependabot/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The job-level `contains()` above sees the whole merge message, whose third line is the PR
      # title, so a PR merely *titled* "... from daften/dependabot/..." would pass it. Only the
      # subject line names the merged branch; every later step requires this check.
      - name: Confirm a Dependabot merge from the subject line
        id: guard
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          SUBJECT=$(printf '%s\n' "$HEAD_MSG" | head -n 1)
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s\n' "$SUBJECT" | grep -Eq '^Merge pull request #[0-9]+ from daften/dependabot/'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a Dependabot merge (subject: ${SUBJECT}); nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.release == 'true'
        with:
          ref: main
          fetch-depth: 0
          # PAT, not GITHUB_TOKEN: the pushed tag must trigger publish.yml.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.release == 'true'
        with:
          node-version: 24

      - name: Bump patch version
        if: steps.guard.outputs.release == 'true'
        id: bump
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${NEW_VERSION}"

      - name: Write changelog entry
        if: steps.guard.outputs.release == 'true'
        env:
          # env indirection, not inline ${{ }} interpolation: the commit
          # message is attacker-influenceable text and must never be
          # spliced into shell source.
          HEAD_MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            BULLET='Manually triggered security release (workflow_dispatch)'
          else
            # Line 3 is the merged PR's title: this repo's merge_commit_message
            # setting is PR_TITLE, so the merge commit body is exactly that.
            # The merge subject itself ("Merge pull request #N from ...") would
            # be a useless changelog bullet, hence the offset.
            BULLET=$(printf '%s\n' "$HEAD_MSG" | sed -n '3p')
            # Fail loudly rather than writing a junk bullet: if the repo's
            # merge_commit_message is ever changed away from PR_TITLE, the
            # release stops here instead of shipping "Merge pull request #N".
            case "$BULLET" in
              'chore(deps'*) ;;
              *)
                echo "::error::Expected the PR title on line 3 of the merge commit, got: '${BULLET}'. Check that the repo's merge_commit_message setting is still PR_TITLE."
                exit 1
                ;;
            esac
          fi
          bash scripts/release-changelog.sh "$VERSION" "$BULLET"

      - name: Commit, tag, push (skipped in dry-run)
        if: steps.guard.outputs.release == 'true' && (github.event_name == 'push' || inputs.dry-run == false)
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Automated security release ${VERSION}"
          git push --atomic origin main "v${VERSION}"

      - name: Dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          echo "DRY RUN — would release v${{ steps.bump.outputs.version }} with this diff:"
          git diff
